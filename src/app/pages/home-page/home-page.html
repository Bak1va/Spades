<div class="home-container">
  <div class="home-header">
    <h1>{{ translateService.translate('home.title') }}</h1>
    <select class="lang-select" [(ngModel)]="lang" (ngModelChange)="setLanguage($event)" title="Change language">
      <option *ngFor="let opt of translateService.languageOptions" [value]="opt.code">{{ opt.label }}</option>
    </select>
  </div>

  <button class="btn-primary" (click)="startProtected()">
    {{ translateService.translate('home.startNewGame') }}
  </button>

  <div class="join-section">
    <p>{{ translateService.translate('home.orJoinWithCode') }}</p>
    <div class="join-form">
      <input type="text" [(ngModel)]="joinCode" [placeholder]="translateService.translate('home.gameCode')"
        class="input-field" />
      <button class="btn-secondary" (click)="joinGame()" [disabled]="!joinCode">
        {{ translateService.translate('home.join') }}
      </button>
    </div>
  </div>
</div>
