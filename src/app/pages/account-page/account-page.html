<div class="account-container">
  <!-- Header -->
  <header class="account-header">
    <div class="header-left">
      <span class="logo-icon">♠</span>
      <h1>Account</h1>
    </div>
    <button class="btn-home" (click)="goBack()">
      Home
    </button>
  </header>

  <!-- Loading state -->
  <div *ngIf="loading" class="loading-state">
    <div class="spinner"></div>
    <p>Loading...</p>
  </div>

  <!-- Main content -->
  <div class="content-wrapper" *ngIf="!loading">
    <div *ngIf="authenticated; else notAuth">
      <div class="profile-card">
        <div class="profile-header">
          <div class="avatar">{{ (fullName || username || '?').charAt(0).toUpperCase() }}</div>
          <div class="user-info">
            <h2>{{ fullName || username }}</h2>
            <p class="username">@{{ username }}</p>
          </div>
        </div>

        <div class="profile-details">
          <div class="detail-row" *ngIf="email">
            <span class="label">Email</span>
            <span class="value">{{ email }}</span>
          </div>
        </div>

        <button class="btn-logout" (click)="logout()">
          Logout
        </button>
      </div>
    </div>

    <ng-template #notAuth>
      <div class="auth-message">
        <p class="message-text">You are not authenticated.</p>
        <button class="btn-login" (click)="login()">
          Login
        </button>
      </div>
    </ng-template>
  </div>
</div>
