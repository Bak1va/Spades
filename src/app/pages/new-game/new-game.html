<div class="new-game-container">
  <div class="header">
    <div class="header-left">
      <span class="logo-icon">♠</span>
      <h1>{{ translateService.translate('newGame.createGame') }}</h1>
    </div>
    <select class="lang-select" [(ngModel)]="lang" (ngModelChange)="setLanguage($event)" title="Change language">
      <option *ngFor="let opt of translateService.languageOptions" [value]="opt.code">{{ opt.label }}</option>
    </select>
  </div>

  <!-- Loading state while checking authentication -->
  <div *ngIf="isLoading" class="loading-state">
    <div class="spinner"></div>
    <p>{{ translateService.translate('newGame.checkingAuth') || 'Loading...' }}</p>
  </div>

  <!-- Form shown only when authenticated -->
  <div *ngIf="!isLoading" class="form-section">
    <div class="form-group">
      <label for="gameName">{{ translateService.translate('newGame.gameName') }}</label>
      <input type="text" id="gameName" [(ngModel)]="gameName"
        [placeholder]="translateService.translate('newGame.enterGameName')" class="input-field" />
    </div>

    <div class="form-group">
      <label>{{ translateService.translate('newGame.yourName') }}</label>
      <div class="input-field readonly" style="padding: 8px; background: #f5f5f5; border-radius:4px; color: #333;">
        {{ userName }}
      </div>
    </div>

    <div class="form-group">
      <label for="votingSystem">{{ translateService.translate('newGame.votingSystem') }}</label>
      <select id="votingSystem" [(ngModel)]="selectedVotingSystem" class="input-field">
        <option value="fibonacci">{{ translateService.translate('newGame.fibonacci') }}</option>
        <option value="tshirt">{{ translateService.translate('newGame.tshirt') }}</option>
        <option value="powers">{{ translateService.translate('newGame.powers') }}</option>
      </select>
    </div>

    <button class="btn-primary" (click)="createGame()" [disabled]="!userName.trim()">
      {{ translateService.translate('newGame.createButton') }}
    </button>
  </div>
</div>
